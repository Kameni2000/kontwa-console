name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Angular — tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tests unitaires (Karma, Chrome sans interface)
        run: npm run test:ci
      - name: Build de production
        run: npm run build
      - name: Tests de bout en bout (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          CI: true

  api:
    name: ASP.NET Core — build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
